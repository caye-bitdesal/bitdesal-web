<svg xmlns="http://www.w3.org/2000/svg" width="680" height="900" viewBox="0 0 680 900">
<title>SDD — Spec-Driven Development · Bitdesal (English)</title>
<desc>Bitdesal Spec-Driven Development flow with AI Engineering Manifesto principles, in English.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>text { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; }</style>
</defs>

<rect width="680" height="900" fill="#F5F2EB"/>

<!-- Header -->
<rect x="0" y="0" width="680" height="62" fill="#2E6E63"/>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#F0EDE3">Spec-Driven Development</text>
<text x="340" y="46" text-anchor="middle" font-size="11" fill="#5DCAA5">AI Engineering Manifesto · Bitdesal</text>

<!-- Flow -->
<rect x="195" y="78" width="290" height="48" rx="8" fill="#2E6E63"/>
<text x="340" y="99" text-anchor="middle" font-size="13" font-weight="600" fill="#F0EDE3">01 · User Story</text>
<text x="340" y="117" text-anchor="middle" font-size="11" fill="#9FE1CB">Define and refine the requirement</text>

<line x1="340" y1="126" x2="340" y2="144" stroke="#2E6E63" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="195" y="144" width="290" height="48" rx="8" fill="#2E6E63"/>
<text x="340" y="165" text-anchor="middle" font-size="13" font-weight="600" fill="#F0EDE3">02 · Architecture Plan</text>
<text x="340" y="183" text-anchor="middle" font-size="11" fill="#9FE1CB">You decide the structure</text>

<line x1="340" y1="192" x2="340" y2="210" stroke="#2E6E63" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="195" y="210" width="290" height="48" rx="8" fill="#2E6E63"/>
<text x="340" y="231" text-anchor="middle" font-size="13" font-weight="600" fill="#F0EDE3">03 · Task Breakdown</text>
<text x="340" y="249" text-anchor="middle" font-size="11" fill="#9FE1CB">Split into simple, concrete tasks</text>

<line x1="340" y1="258" x2="340" y2="276" stroke="#2E6E63" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="160" y="276" width="360" height="70" rx="10" fill="#1B4A43" stroke="#2E6E63" stroke-width="1.5"/>
<text x="340" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#F0EDE3">04 · Specification</text>
<text x="340" y="320" text-anchor="middle" font-size="11" fill="#9FE1CB">The real product · Executable blueprint</text>
<text x="340" y="337" text-anchor="middle" font-size="10" fill="#5DCAA5">Complete · Unambiguous · No hallucinations</text>

<line x1="340" y1="346" x2="340" y2="364" stroke="#2E6E63" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="195" y="364" width="290" height="48" rx="8" fill="#2E6E63"/>
<text x="340" y="385" text-anchor="middle" font-size="13" font-weight="600" fill="#F0EDE3">05 · Implementation Plan</text>
<text x="340" y="403" text-anchor="middle" font-size="11" fill="#9FE1CB">Step-by-step guide for the agent</text>

<line x1="340" y1="412" x2="340" y2="430" stroke="#2E6E63" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="195" y="430" width="290" height="48" rx="8" fill="#0F6E56" stroke="#1D9E75" stroke-width="1"/>
<text x="340" y="451" text-anchor="middle" font-size="13" font-weight="600" fill="#F0EDE3">06 · Implement</text>
<text x="340" y="469" text-anchor="middle" font-size="11" fill="#9FE1CB">Agent executes · You supervise</text>

<!-- Feedback loop -->
<path d="M195 454 L148 454 L148 168 L195 168" fill="none" stroke="#5DCAA5" stroke-width="0.8" stroke-dasharray="4 4" marker-end="url(#arr)" opacity="0.75"/>
<text x="136" y="316" text-anchor="middle" font-size="10" fill="#5DCAA5" transform="rotate(-90,136,316)">Refine if scope changes</text>

<line x1="40" y1="498" x2="640" y2="498" stroke="#2E6E63" stroke-width="0.5" opacity="0.3"/>
<text x="340" y="518" text-anchor="middle" font-size="11" font-weight="600" fill="#5F5E5A">Manifesto Principles</text>

<rect x="40" y="528" width="290" height="68" rx="6" fill="#FFFFFF" stroke="#2E6E63" stroke-width="0.5"/>
<text x="56" y="548" font-size="11" font-weight="600" fill="#2E6E63">I · Trust is earned</text>
<text x="56" y="565" font-size="10.5" fill="#444441">Understand your code. If you can't debug it</text>
<text x="56" y="581" font-size="10.5" fill="#444441">at 5am, don't commit it.</text>

<rect x="350" y="528" width="290" height="68" rx="6" fill="#FFFFFF" stroke="#2E6E63" stroke-width="0.5"/>
<text x="366" y="548" font-size="11" font-weight="600" fill="#2E6E63">II · The Spec is the product</text>
<text x="366" y="565" font-size="10.5" fill="#444441">In the AI age, the Spec is the primary</text>
<text x="366" y="581" font-size="10.5" fill="#444441">deliverable, not the code.</text>

<rect x="40" y="606" width="290" height="68" rx="6" fill="#FFFFFF" stroke="#2E6E63" stroke-width="0.5"/>
<text x="56" y="626" font-size="11" font-weight="600" fill="#2E6E63">III · Engineering rigor</text>
<text x="56" y="643" font-size="10.5" fill="#444441">Fix the root cause. Never adjust a test</text>
<text x="56" y="659" font-size="10.5" fill="#444441">to fit broken code.</text>

<rect x="350" y="606" width="290" height="68" rx="6" fill="#FFFFFF" stroke="#2E6E63" stroke-width="0.5"/>
<text x="366" y="626" font-size="11" font-weight="600" fill="#2E6E63">IV · You are the engineer</text>
<text x="366" y="643" font-size="10.5" fill="#444441">You define the architecture.</text>
<text x="366" y="659" font-size="10.5" fill="#444441">The agent executes.</text>

<rect x="195" y="684" width="290" height="68" rx="6" fill="#FFFFFF" stroke="#2E6E63" stroke-width="0.5"/>
<text x="340" y="704" text-anchor="middle" font-size="11" font-weight="600" fill="#2E6E63">V · Token economics</text>
<text x="340" y="721" text-anchor="middle" font-size="10.5" fill="#444441">Precise specs = fewer iterations</text>
<text x="340" y="737" text-anchor="middle" font-size="10.5" fill="#444441">= higher ROAI.</text>

<rect x="40" y="764" width="600" height="46" rx="8" fill="#1B4A43"/>
<text x="340" y="783" text-anchor="middle" font-size="12" font-weight="600" fill="#F0EDE3">Key metric: ROAI — Return on AI Investment</text>
<text x="340" y="801" text-anchor="middle" font-size="10" fill="#5DCAA5">Value delivered · Secure system · Sound architecture</text>

<text x="40" y="830" font-size="9.5" fill="#888780">#SDD #AIEngineering #CleanArchitecture #SpecDrivenDevelopment #ROAI #Bitdesal</text>

<image href="data:image/jpeg;base64," x="566" y="846" width="72" height="52" preserveAspectRatio="xMidYMid meet"/>
</svg>
